<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sajag: a private, cited second opinion on suspicious messages. Checks run on your device first." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sajag: private scam second opinion</title>
  </head>
  <body>
    <a class="skip" href="#input-card">Skip to the checker</a>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 4 8v8c0 7 5 11.5 12 13 7-1.5 12-6 12-13V8L16 3Z" /><path class="tick" d="m10.5 16.5 3.8 3.8 7.2-7.6" /></svg>
        <div>
          <h1>Sajag <span lang="hi">सजग</span></h1>
          <p id="tagline" class="muted"></p>
        </div>
      </div>
      <div class="top-actions">
        <span id="model-status" class="status" role="status"></span>
        <button id="model-btn" class="btn ghost" type="button" hidden></button>
        <button id="lang-btn" class="btn ghost" type="button" lang="hi"></button>
      </div>
    </header>

    <main>
      <p id="notice" class="notice" hidden></p>

      <section id="input-card" class="card">
        <h2 id="input-title"></h2>
        <textarea id="msg" rows="7" spellcheck="false"></textarea>
        <div id="drop" class="drop" tabindex="0" role="button" aria-describedby="drop-hint">
          <span id="drop-hint"></span>
          <input id="file" type="file" accept="image/jpeg,image/png" hidden />
        </div>
        <div id="thumb" class="thumb" hidden>
          <img id="thumb-img" alt="Screenshot preview" />
          <button id="thumb-remove" class="btn ghost" type="button"></button>
        </div>
        <label class="field">
          <span id="hide-label"></span>
          <input id="hide" type="text" autocomplete="off" />
        </label>
        <label class="check">
          <input id="allow-cloud" type="checkbox" checked />
          <span id="allow-cloud-label"></span>
        </label>
        <div class="row">
          <button id="check-btn" class="btn primary" type="button"></button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section id="review" class="card" hidden></section>
      <div id="verdict"></div>

      <section class="card">
        <div class="row between">
          <h2 id="history-title"></h2>
          <button id="history-clear" class="btn ghost" type="button"></button>
        </div>
        <ul id="history" class="history"></ul>
      </section>
    </main>

    <footer>
      <p id="footer" class="muted"></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
